<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>持仓助手</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--text:#17212b;--muted:#718096;--green:#07866f;--line:#e7edf0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,"Microsoft YaHei",sans-serif}.shell{display:flex;min-height:100vh}.side{width:230px;background:#102b3a;color:#dce8ed;padding:26px 16px;display:flex;flex-direction:column}.brand{font-size:22px;font-weight:800;padding:0 14px 28px}.mode{font-size:12px;color:#9fc4c8;padding:0 14px 22px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#b9cbd1;text-align:left;padding:12px 14px;border-radius:10px;font-size:15px;cursor:pointer}.nav button.active,.nav button:hover{background:#1d4b57;color:#fff}.content{flex:1;padding:34px 46px;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px}.top h1{margin:0;font-size:30px}.top p{margin:7px 0;color:var(--muted)}.actions{display:flex;gap:10px}.btn{border:1px solid #d3dee2;background:#fff;border-radius:9px;padding:10px 15px;cursor:pointer}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 3px 12px #193b4710}.span-4{grid-column:span 4}.span-12{grid-column:span 12}.label{color:var(--muted);font-size:13px}.value{font-size:31px;font-weight:800;margin-top:8px}.green{color:var(--green)}.row{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.small{font-size:13px;color:var(--muted);margin-top:4px}.empty{padding:35px;text-align:center;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600;font-size:13px}.quota-sort{border:0;background:transparent;color:inherit;font:inherit;padding:0;cursor:pointer}.overlay{position:fixed;inset:0;background:#102b3a66;display:none;align-items:center;justify-content:center;z-index:5}.dialog{background:#fff;border-radius:16px;padding:26px;width:min(680px,calc(100% - 32px));max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 18px 50px #102b3a44}.dialog h2{margin:0 0 18px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;color:var(--muted)}.field input,.field select{padding:11px;border:1px solid #d5e0e4;border-radius:8px;font:inherit}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.fund-picker{position:relative}.fund-picker input{width:100%}.fund-results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid #d5e0e4;border-radius:10px;box-shadow:0 10px 24px #193b4722;z-index:10;max-height:240px;overflow:auto}.fund-option{display:block;width:100%;border:0;background:#fff;text-align:left;padding:11px 13px;cursor:pointer}.fund-option:hover{background:#eef7f5}.fund-option b{display:block}.fund-option span{color:var(--muted);font-size:12px}.quota-toolbar{display:flex;gap:8px;margin-bottom:18px}.quota-tab{border:1px solid #d3dee2;background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer}.quota-tab.active{background:var(--green);color:#fff;border-color:var(--green)}.source-note{font-size:12px;color:var(--muted);margin-top:14px}@media(max-width:900px){.side{width:190px}.content{padding:24px}.span-4{grid-column:span 12}}@media(max-width:640px){.shell{display:block}.side{width:100%;padding:14px}.brand{padding:4px 10px 10px}.mode{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.content{padding:18px}.top h1{font-size:24px}.actions{display:none}}
</style></head>
<body><div class="shell"><aside class="side"><div class="brand">持仓助手</div><div class="mode">远端数据 · demo@example.com</div><nav class="nav"><button data-page="holdings" class="active">▣　持仓概览</button><button data-page="transactions">↕　交易记录</button><button data-page="plans">◷　定投计划</button><button data-page="quotas">▤　额度列表</button><button data-page="settings">⚙　设置</button></nav></aside><main class="content"><div class="overlay" id="overlay"><div class="dialog"><h2 id="dialogTitle">记录交易</h2><form id="dialogForm"></form><div class="dialog-actions"><button class="btn" type="button" onclick="closeDialog()">取消</button><button class="btn primary" type="button" onclick="submitDialog()">保存</button></div></div></div><div class="top"><div><h1 id="title">持仓概览</h1><p id="subtitle">查看当前持仓、投入成本与估算市值</p></div><div class="actions"><button class="btn" onclick="exportData()">导出数据</button><button class="btn primary" onclick="addTransaction()">+ 记录交易</button></div></div><section id="app"></section></main></div>
<script>
const app=document.querySelector('#app');let quotaCategory='all';let quotaSortKey='limit',quotaSortOrder='desc';let searchTimer;const titles={holdings:['持仓概览','查看当前持仓、投入成本与估算市值'],transactions:['交易记录','所有买入与卖出记录'],plans:['定投计划','管理周期与执行日'],quotas:['额度列表','纳斯达克100与标普500 QDII 申购限制'],settings:['设置','数据源与数据迁移']};
async function api(url,options){const r=await fetch(url,options);const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'请求失败');return data}function money(v){return Number(v||0).toFixed(2)}function formalMoney(v){return v==null?'—':'¥'+money(v)}function formalRate(v){return v==null?'—':(Number(v)*100).toFixed(2)+'%'}
 function fundPicker(){return '<div class="fund-picker"><input id="fundSearch" autocomplete="off" placeholder="输入基金代码或名称" oninput="searchFunds(this.value)"><input id="fCode" type="hidden"><input id="fName" type="hidden"><div id="fundResults" class="fund-results" style="display:none"></div></div>'}
async function searchFunds(q){clearTimeout(searchTimer);const box=document.querySelector('#fundResults');if(!box)return;if(!q.trim()){box.style.display='none';return}searchTimer=setTimeout(async()=>{try{const items=await api('/api/funds/search?q='+encodeURIComponent(q));box.innerHTML=items.length?items.map(x=>`<button class="fund-option" type="button" onclick="chooseFund('${x.code}','${String(x.name).replace(/'/g,"\\'")}')"><b>${x.name}</b><span>${x.code} · ${x.type||'基金'}</span></button>`).join(''):'<div class="empty">没有匹配的基金</div>';box.style.display='block'}catch(e){box.innerHTML='<div class="empty">基金目录暂时无法加载</div>';box.style.display='block'}},220)}
 function chooseFund(code,name){document.querySelector('#fundSearch').value=`${name} (${code})`;document.querySelector('#fCode').value=code;document.querySelector('#fName').value=name;document.querySelector('#fundResults').style.display='none'}
async function render(page='holdings'){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.querySelector('#title').textContent=titles[page]?.[0]||'设置';document.querySelector('#subtitle').textContent=titles[page]?.[1]||'';
if(page==='holdings'){const [h,f]=await Promise.all([api('/api/holdings'),api('/api/funds')]);const names=Object.fromEntries(f.map(x=>[x.code,x.name]));const invested=h.reduce((s,x)=>s+Number(x.invested||0),0);const redeemed=h.reduce((s,x)=>s+Number(x.redeemed||0),0);const cost=h.reduce((s,x)=>s+Number(x.cost||0),0);const valued=h.length>0&&h.every(x=>x.marketValue!=null&&x.profit!=null);const marketValue=valued?h.reduce((s,x)=>s+Number(x.marketValue),0):null;const profit=valued?h.reduce((s,x)=>s+Number(x.profit),0):null;const profitRate=valued&&cost>0?profit/cost:null;app.innerHTML=`<div class="grid"><div class="card span-3"><div class="label">正式市值</div><div class="value">${formalMoney(marketValue)}</div><div class="small">按最新正式净值计算</div></div><div class="card span-3"><div class="label">正式持有收益</div><div class="value">${formalMoney(profit)}</div><div class="small">市值减剩余持仓成本</div></div><div class="card span-3"><div class="label">正式收益率</div><div class="value">${formalRate(profitRate)}</div><div class="small">正式收益 ÷ 持仓成本</div></div><div class="card span-3"><div class="label">持有基金</div><div class="value">${h.length}</div><div class="small">按已确认交易分组</div></div><div class="card span-4"><div class="label">累计投入</div><div class="value">¥${money(invested)}</div><div class="small">按已确认买入计算</div></div><div class="card span-4"><div class="label">累计赎回</div><div class="value">¥${money(redeemed)}</div><div class="small">已扣除卖出手续费</div></div><div class="card span-4"><div class="label">持仓成本</div><div class="value">¥${money(cost)}</div><div class="small">当前剩余成本</div></div><div class="card span-12"><div style="display:flex;justify-content:space-between;align-items:center"><h2>当前持仓</h2><button class="btn" onclick="refreshFunds()">刷新净值</button></div>${h.length?h.map(x=>`<div class="row"><div><b>${names[x.fundCode]||x.fundCode}</b><div class="small">${x.fundCode} · ${money(x.shares)} 份 · 投入 ¥${money(x.invested)} · 赎回 ¥${money(x.redeemed)} · 成本 ¥${money(x.cost)} · ${x.transactions} 笔交易 · 净值 ${x.nav==null?'—':money(x.nav)}${x.navDate?' · '+x.navDate:''}</div></div><div style="text-align:right"><strong class="green">${formalMoney(x.marketValue)}</strong><div class="small">正式收益 ${formalMoney(x.profit)}（${formalRate(x.profitRate)}）</div></div></div>`).join(''):'<div class="empty">暂无持仓，点击右上角记录第一笔交易</div>'}</div></div>`}
else if(page==='transactions'){const [ts,f]=await Promise.all([api('/api/transactions'),api('/api/funds')]);const names=Object.fromEntries(f.map(x=>[x.code,x.name]));app.innerHTML=`<div class="card span-12"><table><thead><tr><th>日期</th><th>基金</th><th>类型</th><th>金额</th><th>份额</th><th>手续费</th><th>时间</th><th>来源</th><th>状态</th></tr></thead><tbody>${ts.map(t=>`<tr><td>${t.date||'—'}</td><td>${names[t.fundCode]||t.fundCode}<div class="small">${t.fundCode}</div></td><td>${t.type==='buy'?'买入':'卖出'}</td><td>${t.entryMode==='shares'?'—':'¥'+money(t.amount)}</td><td>${money(t.shares)}</td><td>¥${money(t.fee)}</td><td>${t.cutoff==='after'?'15:00 后':'15:00 前'}</td><td>${t.source||'—'}</td><td>${t.status==='confirmed'?'已确认':'待确认'}</td></tr>`).join('')}</tbody></table></div>`}
else if(page==='plans'){const p=await api('/api/plans');app.innerHTML=`<div class="card"><button class="btn primary" onclick="addPlan()">+ 新建定投计划</button>${p.length?p.map(x=>`<div class="row"><div><b>${x.fundName||x.fundCode}</b><div class="small">${x.cycle==='daily'?'每天':x.cycle==='weekly'?'每周':'每月'}${x.cycle==='daily'?'':' · 执行日 '+x.executionDay} · ${x.type==='sell'?'卖出':'买入'} · ${x.mode==='shares'?(x.shares||0)+' 份':(x.amount||0)+' 元'} · 来源：定投计划</div></div><span>${x.enabled?'启用':'已暂停'}</span></div>`).join(''):'<div class="empty">还没有定投计划</div>'}</div>`}
else if(page==='quotas'){app.innerHTML='<div class="card"><div class="quota-toolbar"><button class="quota-tab active" data-category="all">全部</button><button class="quota-tab" data-category="纳斯达克100">纳斯达克100</button><button class="quota-tab" data-category="标普500">标普500</button><button class="btn" style="margin-left:auto" onclick="refreshQuotaPage()">刷新额度</button></div><div id="quotaBody" class="empty">正在加载真实额度数据…</div></div>';document.querySelectorAll('.quota-tab').forEach(b=>b.onclick=()=>{quotaCategory=b.dataset.category;document.querySelectorAll('.quota-tab').forEach(x=>x.classList.toggle('active',x===b));loadQuotaTable()});await loadQuotaTable()}
else{app.innerHTML='<div class="card"><h2>数据设置</h2><p>当前使用远端模式，数据保存在服务端账户中。</p><button class="btn" onclick="exportData()">导出 JSON</button><input id="importFile" type="file" accept="application/json,.json" style="display:none" onchange="previewImportFile(this.files[0])"><button class="btn" onclick="document.querySelector(\'#importFile\').click()">导入数据</button><pre id="importPreview" class="small" style="white-space:pre-wrap;margin-top:16px"></pre></div>'}}
function quotaCompareValue(x,key){if(key==='limit'){if(x.status==='暂停申购')return null;return x.limit==null?null:Number(x.limit)}return String(x[key]||(key==='category'?'QDII':'' )).toLocaleLowerCase('zh-CN')}
function quotaSortItems(items){const key=quotaSortKey,dir=quotaSortOrder==='asc'?1:-1;return [...items].sort((a,b)=>{const pausedA=a.status==='暂停申购',pausedB=b.status==='暂停申购';if(key==='limit'&&(pausedA!==pausedB))return pausedA?1:-1;const av=quotaCompareValue(a,key),bv=quotaCompareValue(b,key);if(av==null||av==='')return bv==null||bv===''?0:1;if(bv==null||bv==='')return -1;if(typeof av==='number'&&typeof bv==='number')return (av-bv)*dir;return String(av).localeCompare(String(bv),'zh-CN')*dir})}
function quotaSortButton(key,label){const active=quotaSortKey===key;const arrow=active?(quotaSortOrder==='asc'?' ↑':' ↓'):'';return `<button class="quota-sort" type="button" data-sort="${key}" aria-label="按${label}排序">${label}${arrow}</button>`}
async function editQuota(code){const q=(await api('/api/quotas')).find(x=>x.code===code);if(!q)return;const status=prompt('申购状态',q.status||'未知');if(status===null)return;const raw=prompt('单日限额（元，留空表示未披露）',q.limit==null?'':q.limit);if(raw===null)return;const limit=raw.trim()===''?null:Number(raw);if(limit!==null&&!Number.isFinite(limit)){alert('请输入有效金额');return}await api('/api/quotas/'+encodeURIComponent(code),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,limit})});await loadQuotaTable()}
async function showQuotaDetail(code){const q=window.quotaItems?.find(x=>x.code===code);if(!q)return;alert([`基金：${q.name}（${q.code}）`,`分类：${q.category||'QDII'}`,`申购状态：${q.status||'未知'}`,`单日限额：${q.limit==null?'未披露':'¥'+money(q.limit)}`,`近一年收益率：${q.annualReturn==null?'未披露':(Number(q.annualReturn)*100).toFixed(2)+'%'}`,`数据来源：${q.source||'未披露'}`,`更新时间：${q.updatedAt||'未披露'}`,`额度优先级：${q.valueSource==='user'?'用户覆盖':'自动采集'}`,`自动状态：${q.automaticStatus||'未披露'}`,`自动限额：${q.automaticLimit==null?'未披露':'¥'+money(q.automaticLimit)}`,`详情说明：${q.detail||'未披露'}`].join('\n'))}async function restoreQuota(code){if(!confirm('恢复该基金的自动额度数据？'))return;try{await api('/api/quotas/'+encodeURIComponent(code)+'/restore',{method:'POST'});await loadQuotaTable()}catch(e){alert(e.message)}}
async function loadQuotaTable(){const q=await api('/api/quotas');window.quotaItems=q;const items=quotaSortItems(q.filter(x=>(quotaCategory==='all'||x.category===quotaCategory)&&x.status!=='场内交易'));document.querySelector('#quotaBody').innerHTML=items.length?`<table><thead><tr><th>${quotaSortButton('category','分类')}</th><th>${quotaSortButton('name','基金')}</th><th>${quotaSortButton('status','状态')}</th><th>${quotaSortButton('limit','单日限额')}</th><th>近一年收益率</th><th>优先级</th><th>数据来源</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${items.map(x=>`<tr><td>${x.category||'QDII'}</td><td>${x.name}<div class="small">${x.code}</div></td><td>${x.status||'未知'}</td><td>${x.limit==null?'未披露':'¥'+money(x.limit)}</td><td>${x.annualReturn==null?'未披露':(Number(x.annualReturn)*100).toFixed(2)+'%'}</td><td>${x.valueSource==='user'?'用户覆盖':'自动采集'}</td><td>${x.source||'未披露'}</td><td>${x.updatedAt||'未披露'}</td><td><button class="btn" type="button" onclick="showQuotaDetail('${x.code}')">详情</button> <button class="btn" type="button" onclick="editQuota('${x.code}')">修改</button> <button class="btn" type="button" onclick="restoreQuota('${x.code}')">恢复自动</button></td></tr>`).join('')}</tbody></table><div class="source-note">额度未披露时保留为“未披露”，用户覆盖优先于自动采集；暂停申购按零额度处理并排在最后。</div>`:'<div class="empty">暂无该分类的额度数据</div>';document.querySelectorAll('.quota-sort').forEach(button=>button.onclick=()=>{const key=button.dataset.sort;if(quotaSortKey===key)quotaSortOrder=quotaSortOrder==='asc'?'desc':'asc';else{quotaSortKey=key;quotaSortOrder=key==='limit'?'desc':'asc'}loadQuotaTable()})}
async function refreshQuotaPage(){try{await api('/api/quotas/refresh',{method:'POST'})}catch(e){}await loadQuotaTable()}
 function openDialog(type){document.querySelector('#overlay').style.display='flex';document.querySelector('#dialogTitle').textContent=type==='transaction'?'添加或更新持仓':'新建定投计划';document.querySelector('#dialogForm').innerHTML=type==='transaction'?`<div class="field"><label>基金</label>${fundPicker()}</div><div class="field"><label>操作</label><select id="fType"><option value="buy">买入 / 加仓</option><option value="sell">卖出 / 减仓</option></select></div><div class="field"><label>填写内容</label><select id="fMode" onchange="toggleTradeMode()"><option value="amount">金额</option><option value="shares">份额</option></select></div><div class="field"><label id="amountLabel">买入金额（元）</label><input id="fAmount" type="number" step="0.01" min="0.01" value="100" required></div><div class="field" id="feeField"><label>固定手续费（元，可选）</label><input id="fFee" type="number" step="0.01" min="0" value="0"></div><div class="field"><label>买入日期</label><input id="fDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>买入时间</label><select id="fCutoff"><option value="before">15:00 前</option><option value="after">15:00 后</option></select></div>`:`<div class="field"><label>基金</label>${fundPicker()}</div><div class="field"><label>交易方向</label><select id="fType"><option value="buy">买入</option><option value="sell">卖出</option></select></div><div class="field"><label>录入方式</label><select id="fMode"><option value="amount">金额</option><option value="shares">份额</option></select></div><div class="field"><label>每期金额或份额</label><input id="fAmount" type="number" step="0.01" min="0.01" value="100" required></div><div class="field"><label>手续费模式</label><select id="fFeeMode"><option value="rate">费率 %</option><option value="fixed">固定费用 元</option></select></div><div class="field"><label>手续费数值</label><input id="fFee" type="number" step="0.01" min="0" value="0"></div><div class="field"><label>起始日期</label><input id="fStartDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>定投周期</label><select id="fCycle" onchange="togglePlanCycle()"><option value="daily">每天</option><option value="weekly">每周</option><option value="monthly" selected>每月</option></select></div><div class="field" id="planDayField"><label>执行日</label><input id="fDay" type="number" min="1" max="31" value="1" required></div><div class="field"><label>成交确认时间</label><select id="fCutoff"><option value="before">15:00 前</option><option value="after">15:00 后</option></select></div><div class="field"><label>备注（可选）</label><input id="fNote" maxlength="200"></div><div class="source-note">来源：定投计划</div>`;window.dialogType=type;if(type==='plan')togglePlanCycle()}
 function toggleTradeMode(){const m=document.querySelector('#fMode').value;document.querySelector('#amountLabel').textContent=m==='amount'?'买入金额（元）':'买入份额';document.querySelector('#feeField').style.display=m==='amount'?'grid':'none'}function togglePlanCycle(){const cycle=document.querySelector('#fCycle')?.value;const field=document.querySelector('#planDayField');if(!field)return;field.style.display=cycle==='daily'?'none':'grid';const day=document.querySelector('#fDay');if(day){day.max=cycle==='weekly'?'7':'31';if(cycle==='daily')day.value='1'}}function closeDialog(){document.querySelector('#overlay').style.display='none'}
 async function submitDialog(){const code=document.querySelector('#fCode')?.value.trim(),amount=Number(document.querySelector('#fAmount')?.value);if(!code){alert('请从下拉结果中选择基金');return}if(!amount){alert('请完整填写表单');return}if(window.dialogType==='transaction'){const mode=document.querySelector('#fMode').value;await api('/api/transactions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fundCode:code,fundName:document.querySelector('#fName')?.value||'',type:document.querySelector('#fType').value,entryMode:mode,amount:mode==='amount'?amount:0,shares:mode==='shares'?amount:0,feeMode:'fixed',fixedFee:mode==='amount'?Number(document.querySelector('#fFee').value)||0:0,date:document.querySelector('#fDate').value,cutoff:document.querySelector('#fCutoff').value,status:'pending'})});closeDialog();render('transactions')}else{const mode=document.querySelector('#fMode').value,feeMode=document.querySelector('#fFeeMode').value,feeValue=Number(document.querySelector('#fFee').value)||0,cycle=document.querySelector('#fCycle').value;await api('/api/plans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fundCode:code,fundName:document.querySelector('#fName')?.value||'',type:document.querySelector('#fType').value,mode,amount:mode==='amount'?amount:0,shares:mode==='shares'?amount:0,feeMode,feeRate:feeMode==='rate'?feeValue:0,fixedFee:feeMode==='fixed'?feeValue:0,startDate:document.querySelector('#fStartDate').value,cycle,executionDay:cycle==='daily'?1:Number(document.querySelector('#fDay').value),cutoff:document.querySelector('#fCutoff').value,note:document.querySelector('#fNote').value,source:'定投计划'})});closeDialog();render('plans')}}
function addTransaction(){openDialog('transaction')}function addPlan(){openDialog('plan')}async function refreshFunds(){await api('/api/funds?refresh=1');render('holdings')}async function exportData(){const d=await api('/api/export');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='position-assistant-export.json';a.click()}
async function previewImportFile(file){const output=document.querySelector('#importPreview');if(!output||!file)return;output.textContent='正在预检导入文件…';try{const pkg=JSON.parse(await file.text());const result=await api('/api/import/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pkg)});const c=result.summary.counts;output.textContent=`预检通过（版本 ${result.summary.version}，导出时间 ${result.summary.exportedAt}）\n基金 ${c.funds} 条 · 交易 ${c.transactions} 条 · 定投计划 ${c.plans} 条 · 定投记录 ${c.planEntries} 条 · 额度覆盖 ${c.quotaOverrides} 条\n合计 ${c.total} 条\n当前仅完成预检，确认覆盖导入将在后续步骤执行。`}catch(e){output.textContent='预检失败：'+e.message}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>render(b.dataset.page));
</script><script src="/trading.js"></script></body></html>
