name: Build and publish Android APK release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: client
        run: flutter pub get

      - name: Build split APKs
        working-directory: client
        env:
          QUOTA_SERVICE_URL: https://quota.yexl.top
        run: >-
          flutter build apk --release --split-per-abi
          --dart-define=QUOTA_SERVICE_URL=${QUOTA_SERVICE_URL}
          --dart-define=BUNDLE_QUOTA_DATA=false

      - name: Prepare release assets
        working-directory: client
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release/position-assistant-${RELEASE_TAG}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release/position-assistant-${RELEASE_TAG}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "release/position-assistant-${RELEASE_TAG}-x86_64.apk"
          sha256sum release/*.apk > release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PositionAssistant ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Android APK release for `${{ github.ref_name }}`.

            This build contains split APKs for arm64-v8a, armeabi-v7a, and x86_64.
            The current Android release signing configuration uses the default debug keystore and is intended for installation/testing, not app-store publishing.
          files: |
            client/release/*.apk
            client/release/SHA256SUMS.txt
